name: Unit tests

# OPS-74: the ordinary-path gate. Runs `pnpm test` on every push and every pull
# request. Before this workflow existed, `pnpm test` ran in CI on no trigger at
# all in this repository, which made the QA-19 guard below advisory — it fired
# only when somebody chose to run the suite by hand, which is exactly the
# population it was written to protect against.
#
# `pnpm test` here is two chained steps, in this order:
#   1. scripts/check-no-bare-launchers.mjs — the QA-19 guard against one-shot
#      package runners, the commands that resolve a bare name against the public
#      registry and execute whatever comes back. Making this binding is the main
#      reason the trigger exists.
#   2. vitest run — the unit suite.
#
# OPS-85 then runs `pnpm run build`. That is `vue-tsc --build && vite build`, so
# it SUBSUMES `pnpm run type-check`, which is `vue-tsc --build` on its own.
# Running both would be two names for one pass, and a reader seeing both listed
# would reasonably assume they covered different things. The vue-tsc half is a
# solution build over all four projects in tsconfig.json's references, so it
# reaches src/, the server and robot stub, tests/, and the tooling files OPS-75
# brought behind the gate.
#
# WHY THE SAME JOB, NOT A PARALLEL ONE. A parallel job is a second independently
# named check, and each name has to be added to branch protection separately —
# operational cost paid by a human, for no extra coverage. Here it would also have
# to duplicate this job's entire two-repository setup: both checkouts, corepack,
# node, two installs and the vue-ui build, roughly doubling the CI time and
# creating a second place to keep in sync with the coupling described below. The
# price of a single job is fail-fast: an earlier failure masks a later one until
# it is fixed, which is acceptable for a gate whose purpose is to stop the merge
# either way.
#
# The build runs AFTER `pnpm test`, because the QA-19 guard is the first link of
# that chained command and must stay the first thing this job runs — a job that
# type-checks before it checks for one-shot package runners has put the cheap
# convenience ahead of the reason the trigger exists.
#
# WHY THIS JOB CHECKS OUT TWO REPOSITORIES. pnpm-workspace.yaml carries the
# temporary PLAT-22 override redirecting @galvanized-pukeko/vue-ui to
# `file:../galvanized-pukeko/packages/galvanized-pukeko-vue-ui`, and pnpm-lock.yaml
# records it as a directory resolution. Without that directory on disk,
# `pnpm install --frozen-lockfile` here fails with ENOENT before a single test
# runs — measured, not inferred. So galvanized-pukeko is checked out beside this
# repository and its vue-ui package is built first: a file: dependency packs
# without its dist/ when the target is unbuilt, and vue-ui's entry point lives in
# dist/, so an unbuilt sibling surfaces later as a module-not-found that reads
# like a code error and is not one.
#
# The consequence is a real coupling, and it should be weighed rather than
# absorbed: a green tick here is no longer a statement about this repository
# alone. It also asserts that galvanized-pukeko main installs and builds vue-ui.
# When the PLAT-22 redirect is dropped and this repository takes a published
# @galvanized-pukeko/vue-ui from the registry again, delete the second checkout
# and the two galvanized steps; the rest of this job then matches
# galvanized-pukeko's own unit-tests.yml exactly.
#
# The build step deepens that coupling rather than merely inheriting it: vue-tsc
# resolves @galvanized-pukeko/vue-ui to the sibling checkout's GENERATED
# dist/index.d.ts, so this repository's type-check now runs against
# galvanized-pukeko main's types rather than against the published version this
# package.json pins. A breaking type change landing there turns this job red.
#
# WHAT THIS CHECK DOES NOT COVER. A green tick here is narrower than "CI passed":
#   - No type-checking of the tooling JavaScript. tsconfig.tooling.json sets
#     `allowJs: true` with `checkJs: false`, so it-robot.js and the scripts/*.mjs
#     files are PARSED — a syntax error in one fails this job — but their types
#     are not checked. That is the deliberate OPS-75 boundary, measured rather
#     than assumed, and the reasoning is recorded in tsconfig.tooling.json itself.
#   - No end-to-end tests. `pnpm run e2e` (it-robot.js) needs a booted stack and
#     has no CI home anywhere in this repository.
#   - No release pipeline. This repository still has no release workflow.
#
# WHY THE E2E HALF IS NOT ON THIS TRIGGER. Beyond needing a booted server and a
# browser, a pull request from a fork gets a read-only token and no repository
# secrets, so a live end-to-end run could not authenticate to a model provider at
# all and would fail for a reason that says nothing about the change. It belongs
# on a deliberate, secret-bearing trigger of its own.
#
# `push` is deliberately unfiltered, matching lockfile-guard.yml. A same-repo pull
# request therefore runs this twice, once for each trigger; that is the existing
# repository convention and the cost is one short job.

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    name: Guard and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Check out pukeko-robot-controller
        uses: actions/checkout@v6
        with:
          path: pukeko-robot-controller
      # Must land inside GITHUB_WORKSPACE, so both repositories sit in
      # subdirectories and the file: path above resolves between them.
      - name: Check out the galvanized-pukeko sibling
        uses: actions/checkout@v6
        with:
          repository: pukeko-robotics/galvanized-pukeko
          ref: main
          path: galvanized-pukeko
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: |
            pukeko-robot-controller/pnpm-lock.yaml
            galvanized-pukeko/pnpm-lock.yaml
      - name: Install galvanized-pukeko
        working-directory: galvanized-pukeko
        run: pnpm install --frozen-lockfile
      - name: Build vue-ui
        working-directory: galvanized-pukeko
        run: pnpm --filter @galvanized-pukeko/vue-ui build
      - name: Install dependencies
        working-directory: pukeko-robot-controller
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        working-directory: pukeko-robot-controller
        run: pnpm test
      - name: Build
        working-directory: pukeko-robot-controller
        run: pnpm run build
